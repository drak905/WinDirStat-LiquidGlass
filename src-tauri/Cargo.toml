[package]
name = "windirstat_liquid_glass"
version = "0.1.0"
edition = "2021"
description = "WinDirStat Liquid Glass backend - Pluggable Multi-Agent CLI Hub"

[lib]
name = "windirstat_liquid_glass"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
url = "2.5"
