[package]
name = "windirstat_liquid_glass"
version = "0.1.0"
edition = "2021"
description = "WinDirStat Liquid Glass backend - Core IPC Bridge and Multi-Agent CLI Hub"

[lib]
name = "windirstat_liquid_glass"
path = "src/lib.rs"

[dependencies]
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
