[package]
name = "windirstat_liquid_glass"
version = "0.1.0"
edition = "2021"
description = "WinDirStat Liquid Glass backend engine — 7-Day Quarantine & Rollback Vault slice"

[lib]
name = "windirstat_liquid_glass"
path = "src/lib.rs"

[[bin]]
name = "wds-vault"
path = "src/bin/wds-vault.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v7", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = "3.14"
