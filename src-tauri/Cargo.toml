[package]
name = "windirstat_liquid_glass"
version = "0.1.0"
edition = "2021"

[lib]
name = "windirstat_liquid_glass"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
